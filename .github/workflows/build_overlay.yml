         id: tag_version
 
       - name: Get Tauri version
         id: tauri_version
         run: |
           tauri_version=$(node scripts/version.mjs)
           echo "tauri_version=$tauri_version" >> $GITHUB_OUTPUT
 
       - name: Compare
         run: |
